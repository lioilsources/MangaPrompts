  # ── WAI Illustrious — anime, Danbooru tags ────────────────────────────────
  # Reuses the shared tag axes, but wai_quality/wai_negative instead of the
  # Pony ones: the score_N ladder means nothing to Illustrious. Deliberately
  # no pose_duo here — its values are prose, and mixing prose into a tag
  # prompt is the exact mismatch these per-model templates exist to prevent.

  - id: template_wai_person
    label: "Anime (WAI) — full figure"
    description: "WAI Illustrious: one character, head to toe, Danbooru tags"
    workflow: wai
    slot_order:
      - wai_quality
      - pony_subject
      - pony_framing
      - pony_body
      - pony_hair
      - pony_eyes
      - pony_expression
      - pony_style
      - pony_clothing
      - pony_pose
      - pony_background
