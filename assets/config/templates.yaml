  # ── PonyDiffusion / Danbooru tag-based templates ──────────────────────────
  # Quality is the first slot (score boosters + rating).
  # All slot names are prefixed pony_ to stay fully isolated from natural-
  # language templates. The engine joins values with ", " — no extra logic needed.

  - id: template_pony_portrait
    label: "Pony — Portrait"
    description: "PonyDiffusion: one figure, Danbooru tags"
    workflow: pony
    slot_order:
      - pony_quality
      - pony_subject
      - pony_framing
      - pony_body
      - pony_hair
      - pony_eyes
      - pony_expression
      - pony_style
      - pony_clothing
      - pony_pose
      - tag_pose_duo
      - pony_background
    negative_slot: pony_negative
    separator: ", "
    required_slots:
      - pony_quality
      - pony_subject
      - pony_framing
    optional_slots:
      - tag_pose_duo
      - pony_body
      - pony_hair
      - pony_eyes
      - pony_expression
      - pony_style
      - pony_clothing
      - pony_pose
      - pony_background

  - id: template_pony_scene
    label: "Pony — Scene"
    description: "PonyDiffusion: scene built around background and action"
    workflow: pony
    slot_order:
      - pony_quality
      - pony_subject
      - pony_framing
      - pony_style
      - pony_expression
      - pony_clothing
      - pony_pose
      - tag_pose_duo
      - pony_background
      - pony_hair
      - pony_eyes
      - pony_body
    negative_slot: pony_negative
    separator: ", "
    required_slots:
      - pony_quality
      - pony_subject
      - pony_background
    optional_slots:
      - tag_pose_duo
      - pony_framing
      - pony_style
      - pony_expression
      - pony_clothing
      - pony_pose
      - pony_hair
      - pony_eyes
      - pony_body

