category: tag_pose_duo
label: "Duo pose (tags)"
icon: people
required: false
# Danbooru-tag counterpart of `pose_duo`, for the tag-based templates (Pony and
# WAI). Not a translation of it: prose like "his right hand flat on her
# shoulder blade" is what a T5 encoder wants, while these models want the
# established booru tag for the same idea, and the two do not convert into each
# other.
#
# Naming note: the shared tag axes are still called pony_* for historical
# reasons even though WAI uses them too (their labels now say "(tags)"). New
# shared axes use the tag_ prefix instead; renaming the older ten is a separate
# change, since their ids appear in every tag template's slot_order.
#
# Same rules as the other pose axes: contact and body only, never framing —
# no "full body", no "close-up", those belong to pony_framing.
blocks:
