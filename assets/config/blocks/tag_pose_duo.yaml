  - id: dt_ballroom
    label: "Ballroom dance"
    tags: [dance, ballroom, duo]
    value: "dancing, holding hands, hand on another's waist, facing each other, eye contact"
    mood: [sweet, nostalgic]
    incompatible: [ps_1girl, ps_1girl_mature, ps_1boy]

