category: art_tradition
label: "Art tradition"
icon: museum
required: false
# Art-historical / cultural visual traditions, layered on top of the `medium`
# axis. Distinct from `style`: that one carries genre and mood only, while
# these DO describe how the image is rendered (woodblock, fresco, ink wash,
# relief), so they sit close to `medium` and every one of them contradicts a
# photograph — hence `incompatible: [medium_photoreal]` throughout. Combining
# them with the drawn media is deliberate: anime × ukiyo-e is a good hybrid.
blocks:
  # ── Americas ──────────────────────────────────────────────────────────────
  - id: art_maya
    label: "Maya mural"
    tags: [maya, mural, relief, mesoamerica]
    value: "classic maya mural style, formal profile and three-quarter views, intricate geometric patterns, jade green and deep red colors, hieroglyphic decorative elements, stylized proportions"
    mood: [technical, nostalgic]
    incompatible: [medium_photoreal]

  - id: art_aztec
    label: "Aztec codex / relief"
    tags: [aztec, codex, relief, mesoamerica]
    value: "aztec codex and stone relief style, bold black outlines, vibrant red turquoise and gold accents, geometric feather and sun motifs, formal stylized figures"
    mood: [dark, technical]
    incompatible: [medium_photoreal]

  - id: art_inca
    label: "Inca textile & goldwork"
    tags: [inca, textile, goldwork, andes]
    value: "inca textile and goldwork inspired style, precise geometric patterns, rich gold and deep red tones, formal frontal composition, stylized strong bodies"
    mood: [technical, nostalgic]
    incompatible: [medium_photoreal]

  - id: art_ledger
    label: "Plains ledger art"
