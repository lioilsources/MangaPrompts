category: pose_duo
label: "Duo pose"
icon: people
required: false
# Poses for TWO figures. The `pose` axis describes a single body, so it cannot
# express who holds whom — that is what this one is for. Same rule as `pose`:
# body and contact only, never framing (that lives in `framing`).
#
# Every block is incompatible with the four solo subjects; the engine has no
# "requires" relation, so declaring the negative is how the picker warns you
# that a duo pose needs a duo subject (subject_couple, subject_two_women,
# subject_two_men, or any larger group).
#
# Values name concrete anatomy — which arm, which hand, whose weight is where —
# because "waltz" alone means little to a diffusion model, while "left hand
# clasped, his right hand on her shoulder blade" reconstructs.
blocks:
  # ── Dance ─────────────────────────────────────────────────────────────────
  - id: duo_waltz_hold
    label: "Waltz (closed hold)"
    tags: [dance, waltz, ballroom]
    value: "two dancers in closed ballroom hold, chests squared and slightly offset, his right hand flat on her shoulder blade, her left hand resting on his upper arm, their other hands clasped and raised to shoulder height, both standing tall on the balls of their feet"
    mood: [sweet, nostalgic]
    incompatible: [subject_woman, subject_woman_30s, subject_man, subject_man_30s]

  - id: duo_tango_dip
    label: "Tango (dip)"
    tags: [dance, tango, dip]
    value: "tango dip, one partner leaning far back with spine arched and head trailing, supported by the other's arm braced across the upper back, her trailing leg extended and pointed along the floor, his front knee bent deep to carry the weight"
    mood: [dark, technical]
    incompatible: [subject_woman, subject_woman_30s, subject_man, subject_man_30s]

  - id: duo_salsa_turn
