name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: .
        run: flutter pub get

      - name: Build Windows (release)
        working-directory: .
        run: flutter build windows --release

      - name: Package as ZIP
        shell: pwsh
        run: |
          $src = ".\build\windows\x64\runner\Release"
          $dest = "Tsumiki-${{ github.ref_name }}-Windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $dest

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Tsumiki-${{ github.ref_name }}-Windows.zip
          name: Tsumiki ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
